# Import profile manifest — Sebastian Lague's Digital-Logic-Sim (DLS).
#
# This manifest is metadata and documentation. The authoritative converter is
# the Rust `dls` module in the `jsonrtl-profiles` crate; see
# `../../docs/profiles.md`.

[profile]
id = "dls"
name = "Sebastian Lague Digital-Logic-Sim"
version = "0.1.0"
source_format = "DLS project directory: ProjectDescription.json + Chips/*.json"

[detection]
# A directory is treated as a DLS project when it contains all of these.
required_files = ["ProjectDescription.json"]
required_dirs = ["Chips"]

[support]
# The subset converted today.
primitives = ["NAND"]
bit_width = "any"
combinational_only = true
# Bus split/merge, expressed as canonical schema v1.1 slices. These emit no
# logic: a narrow pin is bound to the bits of the wide pin it names.
bus_converters = ["X-YBIT"]      # e.g. 8-1BIT, 1-8BIT, 8-4BIT, 4-8BIT, 4-1BIT, 1-4BIT
bus_routing = ["BUS-N", "BUS-TERMINUS-N"]
# Both split and merge order their narrow pins most significant first.
bus_bit_order = "msb-first"

# Constructs that produce a precise diagnostic and stop conversion (never
# silently skipped). Sequential elements and hierarchical emission are staged
# follow-up phases (see ../../docs/profiles.md).
[support.rejected]
mixed_width_wires = true
builtins = [
    "CLOCK", "PULSE", "KEY", "3-STATE BUFFER",
    "7-SEGMENT", "DOT DISPLAY", "RGB DISPLAY", "LED",
    "ROM 256x16",
]
# Not a rejection but a consequence: DLS registers and RAM are NAND latches,
# which are genuine combinational cycles for this kernel and are reported by
# the kernel as GRAPH_COMBINATIONAL_CYCLE.
nand_latches = "reported as a combinational cycle" 
